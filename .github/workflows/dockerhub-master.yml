name: CI/CD Pipeline - Build, Push & Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy lên Server sau khi build & push'
        type: boolean
        required: true
        default: true
      image_tag:
        description: 'Custom Image Tag (để trống sẽ tự sinh theo timestamp & git sha)'
        required: false
        default: ''
      rollback_tag:
        description: 'Rollback về Tag cụ thể (nhập tag muốn rollback, sẽ bỏ qua build)'
        required: false
        default: ''

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — ROLLBACK (chỉ chạy khi bấm nút và nhập rollback_tag)
  # ─────────────────────────────────────────────────────────────────────────────
  rollback:
    name: 🔁 Rollback to previous version
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_tag != '' }}

    steps:
      - name: Check Server SSH Configuration
        id: check-config
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [[ -z "$SERVER_HOST" || -z "$SERVER_USER" ]]; then
            echo "::error::SERVER_HOST hoặc SERVER_USER chưa được cấu hình trong Secrets."
            exit 1
          fi
          echo "has_server=true" >> "$GITHUB_OUTPUT"
          echo "✅ Server SSH đã được cấu hình."

      - name: 🔁 Rollback server to tag [${{ inputs.rollback_tag }}]
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ vars.SERVER_DEPLOY_PATH || '~/bmwms' }}"
            eval DEPLOY_PATH="$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            TARGET_TAG="${{ inputs.rollback_tag }}"
            echo "======================================================"
            echo "🔁 ROLLBACK HỆ THỐNG VỀ PHIÊN BẢN: $TARGET_TAG"
            echo "======================================================"

            CURRENT_TAG=$(grep "^IMAGE_TAG=" .env | cut -d '=' -f2 | tr -d ' ' || echo "chưa xác định")
            echo "📌 Phiên bản hiện tại: $CURRENT_TAG"
            echo "🎯 Phiên bản rollback : $TARGET_TAG"
            echo ""

            # Lưu tag hiện tại trước khi rollback
            echo "$CURRENT_TAG" > .last_image_tag
            echo "💾 Đã lưu tag cũ vào .last_image_tag để có thể redo nếu cần."

            # Cập nhật IMAGE_TAG trong .env
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TARGET_TAG/" .env
            else
              echo "IMAGE_TAG=$TARGET_TAG" >> .env
            fi
            echo "✅ Đã cập nhật IMAGE_TAG=$TARGET_TAG trong .env"

            # Pull image rollback (nếu chưa có ở local cache)
            echo "📥 Đang kéo image rollback từ Docker Hub..."
            docker compose -f docker-compose.app.yml pull || echo "⚠️ Sử dụng image local đã cache."

            # Khởi động lại containers với image rollback
            echo "🔄 Đang khởi động lại containers với phiên bản $TARGET_TAG..."
            docker compose -f docker-compose.app.yml up -d --remove-orphans

            echo ""
            echo "======================================================"
            echo "🎉 ROLLBACK THÀNH CÔNG! Trạng thái containers:"
            echo "======================================================"
            docker compose -f docker-compose.app.yml ps

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — BUILD & PUSH (chạy khi push code hoặc bấm nút mà không nhập rollback_tag)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build and push API & Web images
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rollback_tag == '') }}
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.metadata.outputs.tag }}

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4

      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          CUSTOM_TAG="${{ inputs.image_tag }}"
          TAG="${CUSTOM_TAG:-$TIMESTAMP}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Deploy Image Tag: $TAG"

      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_NAMESPACE" ]]; then
            echo "DOCKERHUB_NAMESPACE is empty." >&2
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "DOCKERHUB_USERNAME và DOCKERHUB_TOKEN chưa được cấu hình." >&2
            exit 1
          fi
          echo "Docker Hub namespace: $DOCKERHUB_NAMESPACE"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./BMWMS.API/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-api:${{ steps.metadata.outputs.tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-api:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-api:${{ steps.metadata.outputs.sha_short }}
          cache-from: type=gha,scope=bmwms-api
          cache-to: type=gha,mode=max,scope=bmwms-api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./BMWMS.Web/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-web:${{ steps.metadata.outputs.tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-web:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-web:${{ steps.metadata.outputs.sha_short }}
          cache-from: type=gha,scope=bmwms-web
          cache-to: type=gha,mode=max,scope=bmwms-web

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — DEPLOY (chạy sau build-and-push thành công)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build-and-push.result == 'success' && (github.event_name == 'push' || inputs.deploy != false) }}
    outputs:
      deployed_tag: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Check Server SSH Configuration
        id: check-config
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [[ -z "$SERVER_HOST" || -z "$SERVER_USER" ]]; then
            echo "::warning::SERVER_HOST hoặc SERVER_USER chưa được cấu hình. Bỏ qua bước deploy."
            echo "has_server=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_server=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Deploy to Remote Server
        id: do-deploy
        if: steps.check-config.outputs.has_server == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ vars.SERVER_DEPLOY_PATH || '~/bmwms' }}"
            eval DEPLOY_PATH="$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            NEW_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            echo "======================================================"
            echo "🚀 [Deploy] Tag mới: $NEW_TAG"
            echo "======================================================"

            # Lưu tag hiện tại trước khi deploy (dùng cho auto-rollback nếu thất bại)
            CURRENT_TAG=$(grep "^IMAGE_TAG=" .env 2>/dev/null | cut -d '=' -f2 | tr -d ' ' || echo "")
            if [ -n "$CURRENT_TAG" ]; then
              echo "$CURRENT_TAG" > .last_image_tag
              echo "💾 Đã lưu phiên bản cũ ($CURRENT_TAG) vào .last_image_tag"
            fi

            # Ensure .env file exists
            if [ ! -f .env ]; then
              [ -f .env.example ] && cp .env.example .env || touch .env
              echo "⚠️ .env chưa tồn tại, đã tạo mới. Hãy cấu hình lại!"
            fi

            # Update IMAGE_TAG
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$NEW_TAG/" .env
            else
              echo "IMAGE_TAG=$NEW_TAG" >> .env
            fi

            # Ensure docker network exists
            NETWORK_NAME=$(grep "^BMWMS_NETWORK=" .env | cut -d '=' -f2 | tr -d ' ' || echo "bmwms")
            NETWORK_NAME="${NETWORK_NAME:-bmwms}"
            docker network create "$NETWORK_NAME" 2>/dev/null || true

            # Pull & start
            echo "📥 Đang pull image $NEW_TAG..."
            docker compose -f docker-compose.app.yml pull

            echo "🔄 Đang khởi động lại containers..."
            docker compose -f docker-compose.app.yml up -d --remove-orphans

            # Health check — chờ tối đa 60s cho containers healthy
            echo "⏳ Chờ containers khởi động (tối đa 60s)..."
            sleep 15

            # Kiểm tra các container có đang ở trạng thái running không
            UNHEALTHY=$(docker compose -f docker-compose.app.yml ps --format json \
              | python3 -c "
            import sys, json
            containers = [json.loads(l) for l in sys.stdin if l.strip()]
            bad = [c['Name'] for c in containers if c.get('State','') != 'running']
            print('\n'.join(bad))
            " 2>/dev/null || true)

            if [ -n "$UNHEALTHY" ]; then
              echo "❌ Các container sau không ở trạng thái running:"
              echo "$UNHEALTHY"
              exit 1
            fi

            docker image prune -f
            echo "✅ Deploy hoàn tất! Trạng thái containers:"
            docker compose -f docker-compose.app.yml ps

      # ───────────────────────────────────────────────────────────────────────
      # AUTO-ROLLBACK — chỉ kích hoạt nếu bước Deploy thất bại
      # ───────────────────────────────────────────────────────────────────────
      - name: 🔁 Auto-Rollback on Deploy Failure
        if: steps.check-config.outputs.has_server == 'true' && failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: false
          script: |
            DEPLOY_PATH="${{ vars.SERVER_DEPLOY_PATH || '~/bmwms' }}"
            eval DEPLOY_PATH="$DEPLOY_PATH"
            cd "$DEPLOY_PATH" || exit 0

            echo "======================================================"
            echo "⚠️  DEPLOY THẤT BẠI! Đang tự động ROLLBACK..."
            echo "======================================================"

            # Đọc tag cũ đã lưu trước khi deploy
            if [ ! -f .last_image_tag ]; then
              echo "❌ Không tìm thấy .last_image_tag. Không thể tự động rollback."
              exit 1
            fi

            PREVIOUS_TAG=$(cat .last_image_tag | tr -d ' \n')
            if [ -z "$PREVIOUS_TAG" ]; then
              echo "❌ .last_image_tag trống. Không thể tự động rollback."
              exit 1
            fi

            echo "🔙 Rollback về phiên bản cũ: $PREVIOUS_TAG"

            # Khôi phục IMAGE_TAG về tag cũ
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" .env
            else
              echo "IMAGE_TAG=$PREVIOUS_TAG" >> .env
            fi

            # Khởi động lại với phiên bản cũ
            docker compose -f docker-compose.app.yml pull || echo "⚠️ Sử dụng image cache."
            docker compose -f docker-compose.app.yml up -d --remove-orphans

            echo ""
            echo "======================================================"
            echo "✅ AUTO-ROLLBACK HOÀN TẤT về phiên bản: $PREVIOUS_TAG"
            echo "======================================================"
            docker compose -f docker-compose.app.yml ps
