name: CI/CD Pipeline - Build, Push & Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to remote server after build (toggle on or off)'
        type: boolean
        required: true
        default: true
      image_tag:
        description: 'Custom image tag (leave blank to auto-generate timestamp and git sha)'
        required: false
        default: ''
      rollback_tag:
        description: 'Rollback to specific tag (skips build, directly rolls back server)'
        required: false
        default: ''

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}

jobs:
  # -----------------------------------------------------------------------------
  # JOB 1 - ROLLBACK (triggered manually when rollback_tag is provided)
  # -----------------------------------------------------------------------------
  rollback:
    name: Rollback to Previous Version
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_tag != '' }}
    environment: production

    steps:
      - name: Check Server SSH Configuration
        id: check-config
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [[ -z "$SERVER_HOST" || -z "$SERVER_USER" ]]; then
            echo "::error::SERVER_HOST or SERVER_USER secret is not configured in repository secrets."
            exit 1
          fi
          echo "has_server=true" >> "$GITHUB_OUTPUT"
          echo "[INFO] Server SSH configuration detected."

      - name: Rollback server to tag [${{ inputs.rollback_tag }}]
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ vars.SERVER_DEPLOY_PATH || '~/bmwms' }}"
            eval DEPLOY_PATH="$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            TARGET_TAG="${{ inputs.rollback_tag }}"
            echo "======================================================"
            echo "[ROLLBACK] Rolling back to version: $TARGET_TAG"
            echo "======================================================"

            CURRENT_TAG=$(grep "^IMAGE_TAG=" .env | cut -d '=' -f2 | tr -d ' ' || echo "unknown")
            echo "Current version: $CURRENT_TAG"
            echo "Target version : $TARGET_TAG"
            echo ""

            # Save current tag before rolling back
            echo "$CURRENT_TAG" > .last_image_tag
            echo "Saved current tag to .last_image_tag for reference."

            # Update IMAGE_TAG in .env
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TARGET_TAG/" .env
            else
              echo "IMAGE_TAG=$TARGET_TAG" >> .env
            fi
            echo "Updated IMAGE_TAG=$TARGET_TAG in .env"

            # Pull rollback image (if not available in local cache)
            echo "Pulling rollback image from Docker Hub..."
            docker compose -f docker-compose.app.yml pull || echo "[WARNING] Using local image cache."

            # Restart containers with rollback image
            echo "Restarting containers with version $TARGET_TAG..."
            docker compose -f docker-compose.app.yml up -d --remove-orphans

            echo ""
            echo "======================================================"
            echo "ROLLBACK SUCCESSFUL! Container status:"
            echo "======================================================"
            docker compose -f docker-compose.app.yml ps

  # -----------------------------------------------------------------------------
  # JOB 2 - BUILD AND PUSH (runs on push or manual trigger without rollback_tag)
  # -----------------------------------------------------------------------------
  build-and-push:
    name: Build and Push API and Web Images
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rollback_tag == '') }}
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.metadata.outputs.tag }}

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4

      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          CUSTOM_TAG="${{ inputs.image_tag }}"
          TAG="${CUSTOM_TAG:-$TIMESTAMP}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Deploy Image Tag: $TAG"

      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_NAMESPACE" ]]; then
            echo "DOCKERHUB_NAMESPACE is empty." >&2
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are not configured." >&2
            exit 1
          fi
          echo "Docker Hub namespace: $DOCKERHUB_NAMESPACE"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./BMWMS.API/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-api:${{ steps.metadata.outputs.tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-api:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-api:${{ steps.metadata.outputs.sha_short }}
          cache-from: type=gha,scope=bmwms-api
          cache-to: type=gha,mode=max,scope=bmwms-api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./BMWMS.Web/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-web:${{ steps.metadata.outputs.tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-web:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-web:${{ steps.metadata.outputs.sha_short }}
          cache-from: type=gha,scope=bmwms-web
          cache-to: type=gha,mode=max,scope=bmwms-web

  # -----------------------------------------------------------------------------
  # JOB 3 - DEPLOY (requires manual approval or explicit toggle)
  # -----------------------------------------------------------------------------
  deploy:
    name: Deploy to Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    if: ${{ always() && needs.build-and-push.result == 'success' && (inputs.deploy == true || (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true')) }}
    outputs:
      deployed_tag: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Check Server SSH Configuration
        id: check-config
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [[ -z "$SERVER_HOST" || -z "$SERVER_USER" ]]; then
            echo "::warning::SERVER_HOST or SERVER_USER secret is not configured. Skipping deploy step."
            echo "has_server=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_server=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Remote Server
        id: do-deploy
        if: steps.check-config.outputs.has_server == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ vars.SERVER_DEPLOY_PATH || '~/bmwms' }}"
            eval DEPLOY_PATH="$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            NEW_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            echo "======================================================"
            echo "[Deploy] New tag: $NEW_TAG"
            echo "======================================================"

            # Save current tag before deploy (used for auto-rollback on failure)
            CURRENT_TAG=$(grep "^IMAGE_TAG=" .env 2>/dev/null | cut -d '=' -f2 | tr -d ' ' || echo "")
            if [ -n "$CURRENT_TAG" ]; then
              echo "$CURRENT_TAG" > .last_image_tag
              echo "Saved previous version ($CURRENT_TAG) to .last_image_tag"
            fi

            # Ensure .env file exists
            if [ ! -f .env ]; then
              [ -f .env.example ] && cp .env.example .env || touch .env
              echo "[WARNING] .env file was missing, created from .env.example. Please review configuration!"
            fi

            # Update IMAGE_TAG
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$NEW_TAG/" .env
            else
              echo "IMAGE_TAG=$NEW_TAG" >> .env
            fi

            # Ensure docker network exists
            NETWORK_NAME=$(grep "^BMWMS_NETWORK=" .env | cut -d '=' -f2 | tr -d ' ' || echo "bmwms")
            NETWORK_NAME="${NETWORK_NAME:-bmwms}"
            docker network create "$NETWORK_NAME" 2>/dev/null || true

            # Pull and start
            echo "Pulling image $NEW_TAG..."
            docker compose -f docker-compose.app.yml pull

            echo "Restarting containers..."
            docker compose -f docker-compose.app.yml up -d --remove-orphans

            # Health check - wait up to 60s for containers to stabilize
            echo "Waiting for containers to stabilize (15s)..."
            sleep 15

            # Verify that all containers are in running state
            UNHEALTHY=$(docker compose -f docker-compose.app.yml ps --format json \
              | python3 -c "
            import sys, json
            containers = [json.loads(l) for l in sys.stdin if l.strip()]
            bad = [c['Name'] for c in containers if c.get('State','') != 'running']
            print('\n'.join(bad))
            " 2>/dev/null || true)

            if [ -n "$UNHEALTHY" ]; then
              echo "[ERROR] The following containers are not running:"
              echo "$UNHEALTHY"
              exit 1
            fi

            docker image prune -f
            echo "Deployment completed successfully! Container status:"
            docker compose -f docker-compose.app.yml ps

      # -----------------------------------------------------------------------------
      # AUTO-ROLLBACK - triggers only when Deploy step fails
      # -----------------------------------------------------------------------------
      - name: Auto-Rollback on Deploy Failure
        if: steps.check-config.outputs.has_server == 'true' && failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: false
          script: |
            DEPLOY_PATH="${{ vars.SERVER_DEPLOY_PATH || '~/bmwms' }}"
            eval DEPLOY_PATH="$DEPLOY_PATH"
            cd "$DEPLOY_PATH" || exit 0

            echo "======================================================"
            echo "[WARNING] Deployment failed! Initiating auto-rollback..."
            echo "======================================================"

            # Read previous tag saved before deploy
            if [ ! -f .last_image_tag ]; then
              echo "[ERROR] .last_image_tag not found. Cannot perform auto-rollback."
              exit 1
            fi

            PREVIOUS_TAG=$(cat .last_image_tag | tr -d ' \n')
            if [ -z "$PREVIOUS_TAG" ]; then
              echo "[ERROR] .last_image_tag is empty. Cannot perform auto-rollback."
              exit 1
            fi

            echo "Rolling back to previous version: $PREVIOUS_TAG"

            # Restore IMAGE_TAG to previous tag
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" .env
            else
              echo "IMAGE_TAG=$PREVIOUS_TAG" >> .env
            fi

            # Restart with previous image
            docker compose -f docker-compose.app.yml pull || echo "[WARNING] Using local image cache."
            docker compose -f docker-compose.app.yml up -d --remove-orphans

            echo ""
            echo "======================================================"
            echo "AUTO-ROLLBACK COMPLETED for version: $PREVIOUS_TAG"
            echo "======================================================"
            docker compose -f docker-compose.app.yml ps
