
name: Build and push Docker images v2


on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}

jobs:
  docker:
    name: Build and push API and Web images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4

      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_NAMESPACE" ]]; then
            echo "DOCKERHUB_NAMESPACE is empty. Set the repository variable or configure a repository owner." >&2
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured as GitHub Actions secrets." >&2
            exit 1
          fi
          echo "Docker Hub namespace: $DOCKERHUB_NAMESPACE"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./BMWMS.API/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-api:${{ steps.metadata.outputs.timestamp }}
          cache-from: type=gha,scope=bmwms-api
          cache-to: type=gha,mode=max,scope=bmwms-api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./BMWMS.Web/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/bmwms-web:${{ steps.metadata.outputs.timestamp }}
          cache-from: type=gha,scope=bmwms-web
          cache-to: type=gha,mode=max,scope=bmwms-web
