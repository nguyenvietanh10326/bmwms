version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    depends_on:
      - db
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - ./BMWMS_Data_Final.sql:/scripts/BMWMS_Data_Final.sql
    command: >
      bash -c "
      echo 'Waiting for SQL Server to become available...';
      for i in {1..30}; do
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' && break
        sleep 2
      done;
      echo 'Running initialization script BMWMS_Data_Final.sql...';
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -i /scripts/BMWMS_Data_Final.sql;
      echo 'Initialization complete.';
      "

  api:
    build:
      context: .
      dockerfile: BMWMS.API/Dockerfile
    depends_on:
      - db
    ports:
      - "5076:8080"
    environment:
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - SmtpSettings__Host=${SmtpSettings__Host}
      - SmtpSettings__Port=${SmtpSettings__Port}
      - SmtpSettings__Username=${SmtpSettings__Username}
      - SmtpSettings__Password=${SmtpSettings__Password}
      - SmtpSettings__EnableSsl=${SmtpSettings__EnableSsl}
      - SmtpSettings__FromEmail=${SmtpSettings__FromEmail}
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Jwt__ExpireMinutes=${Jwt__ExpireMinutes}

  web:
    build:
      context: .
      dockerfile: BMWMS.Web/Dockerfile
    depends_on:
      - api
    ports:
      - "5100:8080"
    environment:
      - ApiSettings__BaseUrl=${ApiSettings__BaseUrl}

volumes:
  sql_data:
