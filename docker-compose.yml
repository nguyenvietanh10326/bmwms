version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./BMWMS_Data_Final.sql:/scripts/BMWMS_Data_Final.sql
    command: >
      bash -c "
      echo 'Waiting for SQL Server to become available...';
      for i in {1..30}; do
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' && break
        sleep 2
      done;
      echo 'Running initialization script BMWMS_Data_Final.sql...';
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -i /scripts/BMWMS_Data_Final.sql;
      echo 'Initialization complete.';
      "

  api:
    build:
      context: .
      dockerfile: BMWMS.API/Dockerfile
    depends_on:
      - db
    ports:
      - "5076:8080"
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: BMWMS.Web/Dockerfile
    depends_on:
      - api
    ports:
      - "5100:8080"
    env_file:
      - .env

volumes:
  sql_data:
