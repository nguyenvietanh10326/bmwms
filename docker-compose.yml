version: '3.4'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  api:
    image: bmwms-api
    build:
      context: .
      dockerfile: BMWMS.API/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=BMWMS;User Id=sa;Password=Your_password123;TrustServerCertificate=True
    ports:
      - "5076:8080"
    depends_on:
      - db

  web:
    image: bmwms-web
    build:
      context: .
      dockerfile: BMWMS.Web/Dockerfile
    environment:
      - ApiSettings__BaseUrl=http://api:8080
    ports:
      - "5123:8080"
    depends_on:
      - api

volumes:
  mssql-data:
