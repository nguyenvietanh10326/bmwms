services:
  api:
    image: ${DOCKERHUB_NAMESPACE}/bmwms-api:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${API_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection}"
      SmtpSettings__Host: ${SmtpSettings__Host}
      SmtpSettings__Port: ${SmtpSettings__Port}
      SmtpSettings__Username: ${SmtpSettings__Username}
      SmtpSettings__Password: ${SmtpSettings__Password}
      SmtpSettings__EnableSsl: ${SmtpSettings__EnableSsl}
      SmtpSettings__FromEmail: ${SmtpSettings__FromEmail}
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__ExpireMinutes: ${Jwt__ExpireMinutes}
      WarehouseCapacity__Enabled: ${WarehouseCapacity__Enabled}
      WarehouseCapacity__EnforcementMode: ${WarehouseCapacity__EnforcementMode}
    networks:
      - bmwms

  web:
    image: ${DOCKERHUB_NAMESPACE}/bmwms-web:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ApiSettings__BaseUrl: ${ApiSettings__BaseUrl}
    networks:
      - bmwms

networks:
  bmwms:
    name: ${BMWMS_NETWORK}
    external: true
